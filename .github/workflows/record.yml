name: Webinar Auto Recorder

on:
  repository_dispatch:
    types: [check_webinar]  # 구글 스케줄러가 이 이름을 호출합니다.
  workflow_dispatch:        # 수동 실행용

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # 3.13보다는 안정적인 3.11/3.12 추천

      - name: Install Dependencies
        run: |
          pip install playwright playwright-stealth firebase-admin supabase pandas python-dotenv
          playwright install chromium

      - name: Run Recorder
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_BUCKET_NAME: ${{ secrets.FIREBASE_BUCKET_NAME }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
        run: python main.py
