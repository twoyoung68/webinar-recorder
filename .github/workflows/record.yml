# .github/workflows/record.yml
name: Webinar Auto Recorder

on:
  repository_dispatch:
    types: [check_webinar]
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install playwright playwright-stealth firebase_admin supabase pandas python-dotenv
          playwright install chromium

      - name: Run Recorder
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_BUCKET_NAME: ${{ secrets.FIREBASE_BUCKET_NAME }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          # 구글 달력에서 보내준 데이터를 환경 변수로 주입
          CALENDAR_TITLE: ${{ github.event.client_payload.title }}
          CALENDAR_URL: ${{ github.event.client_payload.url }}
        run: python main.py
